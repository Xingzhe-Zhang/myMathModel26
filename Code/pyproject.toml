[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-resource-modeling"
version = "0.1.0"
description = "Reproducible Q1 quality, dimension, and mixture modeling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.scripts]
q1-quality = "llm_resource.q1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
